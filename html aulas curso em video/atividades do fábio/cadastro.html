<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
  </head>
  <body>
    <fieldset style="width: 100%;">
        <table  cellpadding="3">
          <tr>
            <td><img src="logo.png" alt="Logo" width="90" /></td>
            <td><h1>Formulário de Associação</h1></td>
          </tr>
        </table>
    </fieldset>
        <fieldset style="width:100%">
          <a href="associaction.html">Home</a> &nbsp;
          <a href="cadastro.html">Cadastro</a> &nbsp;
          <a href="">Pagamento</a>
        </fieldset>
    <fieldset style="height: 467px">
      <form action="" method="post">
        <fieldset>
          <legend align="center">DADOS PESSOAIS</legend>
          <table border="0" cellpadding="2" cellspacing="0" width="100%">
            <tr>
              <td width="7%">
                <label for="cpf">CPF:</label>
              </td>
              <td width="34%">
                <input
                  type="text"
                  id="cpf"
                  name="cpf"
                  inputmode="numeric"
                  size="10"
                  maxlength="11"
                  required
                />
                (apenas números)
              </td>
              <td width="7.9%">
                <label for="nascimento">Nascimento:</label>
              </td>
              <td>
                <input type="date" id="nascimento" name="nascimento" />
              </td>
            </tr>
            <tr>
              <td>
                <label for="nome">Nome:</label>
              </td>
              <td>
                <input type="text" id="nome" name="nome" size="69" required />
              </td>
              <td>
                <label for="naturalidade">Naturalidade:</label>
              </td>
              <td>
                <input
                  type="text"
                  id="naturalidade"
                  name="naturalidade"
                  size="18"
                />
                <select
                  name="estado_naturalidade"
                  aria-label="Estado de naturalidade"
                >
                  <option value="PI">Piauí</option>
                  <option value="CE">Ceará</option>
                  <option value="PH">Parnaíba</option>
                </select>
              </td>
            </tr>
            <tr>
              <td><label for="nacionalidade">Nacionalidade:</label></td>
              <td>
                <input
                  type="text"
                  id="nacionalidade"
                  name="nacionalidade"
                  size="17"
                  placeholder="Brasileira"
                />
              </td>
              <td>
                <label for="estado_civil">Estado civil:</label>
              </td>
              <td>
                <select id="estado_civil" name="estado_civil">
                  <option value="casado">Casado(a)</option>
                  <option value="solteiro">Solteiro(a)</option>
                  <option value="viuvo">Viúvo(a)</option>
                  <option value="outro">Outra opção</option>
                </select>
              </td>
            </tr>
            <tr>
              <td><label for="associacao">Tipo de associação:</label></td>
              <td>
                <select id="associacao" name="associacao">
                  <option value="estudante">
                    Estudante (R$ 15,00 por ano)
                  </option>
                  <option value="nao-funcionario">
                    Não funcionário (R$ 20,00)
                  </option>
                </select>
              </td>
              <td>
                <label for="inst">Instituição:</label>
              </td>
              <td>
                <input type="text" size="39" />(univecidade, facudade, empresa
                etc.)
              </td>
            </tr>
            <tr>
              <td>
                <label for="RG">RG:</label>
              </td>
              <td>
                <input type="text" maxlength="11" size="18" nome="RG" />
                <label for="emisor">Emissor RG:</label>
                <input type="text" name="emissor" id="rmissor" size="31" />
              </td>
              <td>
                <label for="profissão">Profissão:</label>
              </td>
              <td>
                <input type="text" name="emissor" id="rmissor" size="28" />
              </td>
            </tr>
          </table>
        </fieldset>
      </form>
      <br />
      <fieldset>
        <legend align="center">DADOS PARA CONTATO</legend>
        <table border="0" cellpadding="2" cellspacing="0" width="100%">
          <tr>
            <td width="7%">
              <label for="logradouro">logradouro:</label>
            </td>
            <td width="29%">
              <input type="text" size="66" />
            </td>
            <td width="2%">
              <label for="bairro">Numero:</label>
            </td>
            <td>
              <input type="text" size="3" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="logradouro">Complemento:</label>
            </td>
            <td>
              <input type="text" size="66" />
            </td>
            <td>
              <label for="bairro">Bairro:</label>
            </td>
            <td>
              <input type="text" size="35" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="logradouro">CEP:</label>
            </td>
            <td>
              <input type="text" size="14" maxlength="8" />(apenas numeros)
            </td>
            <td>
              <label for="cidade">Cidade:</label>
            </td>
            <td>
              <input type="text" size="35" />
              <select id="cidade_bairro" name="cidade_bairro">
                <option value="PI">PI</option>
                <option value="PH">Parnaiba</option>
                <option value="CE">Ceará</option>
                <option value="SP">São Paulo</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>
              <label for="logradouro">E-mail:</label>
            </td>
            <td>
              <input type="email" size="66" />
            </td>
            <td>
              <label for="telefone">Telefone:</label>
            </td>
            <td>
              <input type="text" size="1" maxlength="2" />
              <input type="text" size="12" maxlength="11" />
            </td>
          </tr>
        </table>
      </fieldset>
      <br />
      <input type="button" value="Confirmar"/>
    </fieldset>
    <fieldset style="width: 100%;">
        <label>&copy; 2026 Instituto Rampage. All ridhts reserved</label>
    </fieldset>
    <br>
    <form action="index.html">
        <input type="button" value="voltar">
    </form>
  </body>
</html>
