<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        label{
            color: darkred;
        }
    </style>
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário sem borda:</h1>
    <table border="0" cellpadding="6" cellspacing="0" width="70%" align="center">
        <tr>
            <td><hr size="40" color="darkred"></td>
        </tr>
        <tr>
            <td align="left">
                <h3 style="color: darkred;">Cadastre-se e receba nossas atualizações</h3>
                <hr size="3" color="darkred">
                <form action="processa.index" method="post">
                    <table border="0" cellpadding="6" cellspacing="0" width="70%" align="center">
                        <tr>
                            <td style="text-align: right;"><label>Nome:</label></td>
                            <td><input type="text" name="nome" size="30" maxlength="40" placeholder="Digite seu nome"></td>
                        </tr>
                        <tr>
                            <td style="text-align: right;"><label>Senha:</label></td>
                            <td><input type="password" name="senha" size="30" maxlength="8" placeholder="Digite sua senha"></td>
                        </tr>
                        <tr>
                            <td style="text-align: right;"><label>Confirmção de senha:</label></td>
                            <td><input type="password" name="confir_senha" size="30" maxlength="8" placeholder="Digite sua senha novamente"></td>
                        </tr>
                        <tr>
                            <td style="text-align: right;"><label>Seu tipo de Pizza preferida:</label></td>
                            <td><select name="sabor_pizza" id="sabor_pizza">
                                <option value="mg">margarita</option>
                                <option value="cal">calabresa</option>
                                <option value="quei">4 queijos</option>
                                <option value="carn_sol">carne de sol</option>
                            </select></td>
                        </tr>
                        <tr>
                            <td style="text-align: right;"><label>Quantas vezes come Pizza por semestre:</label></td>
                            <td>
                                <input type="radio" name="vezes_pizza" value="1_5"><label>entre 1 a 5</label><br>
                                <input type="radio" name="vezes_pizza1" value="5 a 10"><label>entre 5 a 10</label><br>
                                <input type="radio" name="vezes_pizza2" value="mais de 10"><label>mais de 10</label>
                            </td>
                        </tr>
                        <tr>
                            <td style="text-align: right;">
                                <label>Comentário:</label>
                            </td>
                            <td><textarea name="comentario" id="comet"></textarea></td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
        <tr>
           <td align="center"><input type="checkbox"><label>Deseja receber e-mail dos nosso parceiros</label></td> 
        </tr>
        <tr>
            <td align="center"><input type="submit" name="enviar" id="enviar">  <input type="reset" value="limpar"></td>
        </tr>
        <tr>
            <td>
                <hr size="3" color="darkred">
            </td>
        </tr>
    <tr>
        <td><hr size="40" color="darkred"></td>
    </tr>
    </table>

    <br><br><br>
